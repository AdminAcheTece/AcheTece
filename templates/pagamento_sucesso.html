<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Pagamento Aprovado - AcheTece</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Open Graph para compartilhamento -->
  <meta property="og:title" content="Pagamento confirmado - AcheTece">
  <meta property="og:description" content="Seu pagamento foi aprovado. Acesse a plataforma e comece a divulgar seus teares.">
  <meta property="og:image" content="{{ url_for('static', filename='logo.jpg', _external=True) }}">
  <meta property="og:url" content="{{ url_for('pagamento_sucesso', _external=True) }}">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon_final.ico') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon_final.png') }}">

  <!-- CSS principal -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet" />

  <style>
    :root{
      /* PALETA (padrão) */
      --olive:#101214;
      --olive-600:#202528;
      --olive-dark:#101214;
      --olive-50:#F5F6F6;

      --bg-150:#F5F6F6;
      --site-bg: var(--bg-150);

      /* CTA */
      --lime:#A8E63D;
      --lime-700:#95D32B;

      --text:#111;
      --muted:#555;
      --maxw:1280px;
    }

    html, body { max-width:100%; overflow-x:hidden; }
    *, *::before, *::after { box-sizing:border-box; }

    /* ✅ “faixa branca” do topo (igual pagamento_erro / quem_somos) */
    body{
      background:#fff !important;
      color:var(--text);
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* ✅ Miolo cinza */
    .faixa-cinza{
      background: var(--site-bg);
      padding: 16px 0 48px;
    }
    .page-outer{
      max-width:var(--maxw);
      margin:0 auto;
      padding:0 16px;
    }

    /* Card central */
    .pay-card{
      max-width: 640px;
      margin: 28px auto 0;
      background:#fff;
      border:1px solid rgba(0,0,0,.08);
      border-radius:16px;
      padding:32px 26px;
      text-align:center;
      box-shadow:none !important;
    }

    .logo-box{
      display:flex;
      justify-content:center;
      margin-bottom:18px;
    }
    .logo-box img{
      max-height:120px;
      width:auto;
      display:block;
    }

    .icone{
      font-size:56px;
      line-height:1;
      margin: 6px 0 10px;
    }

    h1{
      margin:0 0 10px;
      font-size:28px;
      letter-spacing:-0.01em;
      color:#1f7a2a; /* verde sucesso */
      font-weight:800;
    }
    p{
      margin:0 0 16px;
      color:var(--muted);
      font-size:16px;
      line-height:1.55;
      font-weight:600;
    }
    .hint{
      margin-top:14px;
      color:#6a6a6a;
      font-size:13.5px;
      font-weight:600;
    }

    /* Botão padrão: preto → lime */
    .botao-acao{
      display:inline-flex; align-items:center; justify-content:center;
      height:44px; padding:0 22px;
      border:0; border-radius:9999px;
      background:#000; color:var(--lime);
      font-size:15px; font-weight:800;
      text-decoration:none;
      cursor:pointer;
      transition: background-color .15s ease, color .15s ease, transform .12s ease;
      box-shadow:none !important;
      white-space:nowrap;
    }
    .botao-acao:hover{ background:var(--lime); color:#000; transform:translateY(-2px); }
    .botao-acao:active{ background:var(--lime-700); color:#000; transform:translateY(0); }
    .botao-acao:focus{ outline:none; }
    .botao-acao:focus-visible{ outline:2px solid var(--lime); outline-offset:2px; }

    @media (max-width:560px){
      .pay-card{ padding:26px 18px; margin-top:18px; }
      h1{ font-size:24px; }
      p{ font-size:15px; }
    }

    /* ✅ Não “quebra” a faixa branca em dark mode */
    @media (prefers-color-scheme: dark) {
      html, body{ background:#fff !important; color: var(--text); }
    }
  </style>

  <!-- ✅ Header padrão deve ser o ÚLTIMO do head -->
  <link rel="stylesheet" href="{{ url_for('static', filename='header.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='achetece_identidade.css') }}">
</head>

<body class="achetece-site header-v1">
  {% include '_cabecalho_site.html' %}

  <!-- ===== Cabeçalho (igual pagamento_erro / quem_somos) ===== -->


  <!-- ===== MENU MOBILE (SÓ NO MOBILE) ===== -->




  <!-- ✅ Conteúdo no “miolo cinza” -->
  <div class="faixa-cinza">
    <div class="page-outer">

      <div class="pay-card" role="status" aria-live="polite">
        <div class="logo-box">
          <img src="{{ url_for('static', filename='logo.jpg') }}" alt="AcheTece">
        </div>

        <div class="icone">✅</div>

        <h1>Pagamento aprovado</h1>

        <p>
          Seu pagamento foi confirmado com sucesso!<br>
          Estamos validando seu acesso. Isso leva só alguns segundos.
        </p>

        <a href="{{ url_for('login') }}" class="botao-acao">Ir para o login</a>

        <div class="hint" id="hint">
          Você será redirecionado automaticamente quando o acesso estiver liberado.
        </div>

        <noscript>
          <div class="hint">Ative o JavaScript para validação automática. Você pode prosseguir pelo botão acima.</div>
        </noscript>
      </div>

    </div>
  </div>

  <!-- ===== Rodapé (igual padrão das páginas) ===== -->
  {% include '_rodape_site.html' %}

  <!-- ===== JS: Menu mobile (igual pagamento_erro / quem_somos) ===== -->
  <script>
    (function(){
      const openBtn = document.getElementById('openMenuBtn');
      const closeBtn = document.getElementById('closeMenuBtn');
      const backdrop = document.getElementById('menuBackdrop');

      function openMenu(){
        document.body.classList.add('menu-open');
        if(openBtn) openBtn.setAttribute('aria-expanded','true');
      }
      function closeMenu(){
        document.body.classList.remove('menu-open');
        if(openBtn) openBtn.setAttribute('aria-expanded','false');
      }

      if(openBtn) openBtn.addEventListener('click', openMenu);
      if(closeBtn) closeBtn.addEventListener('click', closeMenu);
      if(backdrop) backdrop.addEventListener('click', closeMenu);

      document.addEventListener('keydown', (e)=>{
        if(e.key === 'Escape') closeMenu();
      });
    })();
  </script>

  <!-- (Opcional) Validação automática do acesso e redirecionamento -->
  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const ext = urlParams.get('ext'); // opcional
      const maxTries = 90; // ~ 6 minutos (90 * 4s)
      let tries = 0;

      async function checarStatus() {
        try {
          const qs = ext ? ("?ext=" + encodeURIComponent(ext)) : "";
          const res = await fetch("/api/pagamento_status" + qs, { cache: "no-store" });
          if (res.ok) {
            const js = await res.json();
            if (js && js.status === "ativo") {
              window.location.href = "/login";
              return;
            }
          }
        } catch (e) {}

        tries++;
        if (tries < maxTries) {
          setTimeout(checarStatus, 4000);
        } else {
          const hint = document.getElementById("hint");
          if (hint) hint.textContent = "Se preferir, clique em “Ir para o login” para continuar.";
        }
      }

      setTimeout(checarStatus, 2500);
    })();
  </script>

</body>
</html>
