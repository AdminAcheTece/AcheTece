name: ED02 V5.9 - Conciliacao e gate financeiro protegido
on:
  push:
    branches:
      - ed02-assinaturas-vigencia-ledger
permissions:
  contents: read
jobs:
  v59_replay_shadow_gate:
    name: ED02.5 V5.9 - Regressao replay e shadow SEM ativacao
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar SQLAlchemy
        run: python -m pip install 'SQLAlchemy>=2.0,<3.0'
      - name: Verificar compilacao
        run: |
          python -m py_compile ed02_5_v59_regressao.py ed02_5_v59_shadow.py ed02_5_v59_gate.py ed02_5_v59_pg_shadow_readonly.py
      - name: Testes V5.9 - replay ED02, riscos legados, gate e shadow
        run: |
          python -m unittest -v test_ed02_5_v59_replay test_ed02_5_v59_shadow test_ed02_5_v59_pg_safety
      - name: Gate permanece BLOQUEADO
        run: |
          python -c "from ed02_5_v59_gate import avaliar_gate; s=avaliar_gate(); assert not s.permite_producao and not s.permite_visibilidade_ed02; print('PASSOU: gate documental V5.9 BLOQUEADO, ED01 preservada')"
  v59_shadow_pg_protegido:
    name: ED02.5 V5.9 - Shadow PostgreSQL SOMENTE LEITURA
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ed02-assinaturas-vigencia-ledger' &&
      github.actor == 'AdminAcheTece' &&
      github.event.head_commit.message == 'ED02_RUN_SHADOW_ED025_V59_READONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ed02-postgres-checkout-homolog
      cancel-in-progress: false
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias PostgreSQL
        run: python -m pip install 'SQLAlchemy>=2.0,<3.0' 'psycopg[binary]>=3.1,<4.0'
      - name: Auditoria shadow agregada READ ONLY
        env:
          ED02_HOMOLOG_DATABASE_URL: ${{ secrets.ED02_TEST_DATABASE_URL }}
          ED02_V59_READONLY_AUTORIZADA: 'true'
          ED02_V59_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python ed02_5_v59_pg_shadow_readonly.py
