
name: ED02.3F - Concorrencia PostgreSQL homologacao

on:
  push:
    branches:
      - ed02-assinaturas-vigencia-ledger
    paths:
      - '.github/workflows/ed02-concorrencia-real.yml'

permissions:
  contents: read

jobs:
  teste_concorrencia:
    if: github.ref == 'refs/heads/ed02-assinaturas-vigencia-ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ED02_HOMOLOG_DATABASE_URL: ${{ secrets.ED02_TEST_DATABASE_URL }}

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install "SQLAlchemy>=2.0,<3.0" "psycopg[binary]>=3.1,<4.0"

      - name: Executar teste de concorrencia real
        run: python test_ed02_3f_concorrencia_real.py
