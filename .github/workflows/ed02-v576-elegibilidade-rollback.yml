name: ED02 V5.7.6 - Elegibilidade real com rollback
on:
  push:
    branches: [ed02-assinaturas-vigencia-ledger]
permissions:
  contents: read
jobs:
  safety_v576:
    name: ED02.5 V5.7.6 - Testes de seguranca
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_ed02_5_v576_safety
  homolog_v576:
    name: ED02.5 V5.7.6 - HTTP original PostgreSQL rollback
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ed02-assinaturas-vigencia-ledger' &&
      github.actor == 'AdminAcheTece' &&
      github.event.head_commit.message == 'ED02_RUN_ELIGIBILITY_ED025_V576'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ed02-postgres-checkout-homolog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Ensaio protegido de elegibilidade com rollback
        env:
          ED02_HOMOLOG_DATABASE_URL: ${{ secrets.ED02_TEST_DATABASE_URL }}
          ED02_V576_AUTHORIZED: 'true'
          ED02_V576_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python test_ed02_5_v576_elegibilidade_rollback.py
