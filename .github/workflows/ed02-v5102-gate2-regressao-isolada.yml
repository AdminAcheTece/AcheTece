name: ED02 V5.10.2 - Gate 2 Regressao Isolada SEM Deploy
on:
  push:
    branches:
      - ed02-v5102-gate2-auditoria
    paths:
      - 'ed02_v5102_gate2_runner.py'
      - 'test_ed02_v5102_gate2_runner.py'
      - '.github/workflows/ed02-v5102-gate2-regressao-isolada.yml'
      - 'LEIA_ME_ED02_5_V5102_GATE2.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ed02-v5102-gate2-auditoria
  cancel-in-progress: false
jobs:
  preflight:
    name: Preflight V5102 sem alterar arquivos
    if: ${{ github.ref == 'refs/heads/ed02-v5102-gate2-auditoria' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe do executor
        run: python -m py_compile ed02_v5102_gate2_runner.py
      - name: Onze testes locais de seguranca do executor Gate 2
        run: python -m unittest -v test_ed02_v5102_gate2_runner
      - name: Validar HEAD, candidatos e rotas ED01
        run: python ed02_v5102_gate2_runner.py preflight --out "$RUNNER_TEMP/ed02-v5102-gate2"
      - name: Artefato do preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ED02_V5102_GATE2_PREFLIGHT
          path: ${{ runner.temp }}/ed02-v5102-gate2/
          if-no-files-found: warn
          retention-days: 14
  regressao:
    name: Regressao em copia temporaria SEM Deploy
    if: ${{ github.ref == 'refs/heads/ed02-v5102-gate2-auditoria' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias da branch (sem secrets)
        run: python -m pip install -r requirements.txt
      - name: Regressao ampliada no clone descartavel
        run: python ed02_v5102_gate2_runner.py regression --out "$RUNNER_TEMP/ed02-v5102-gate2"
      - name: Publicar relatorio e log da regressao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ED02_V5102_GATE2_RESULTADOS
          path: ${{ runner.temp }}/ed02-v5102-gate2/
          if-no-files-found: warn
          retention-days: 14
