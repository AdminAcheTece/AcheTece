      - name: Instalar dependencias
        run: python -m pip install "SQLAlchemy>=2.0,<3.0" "psycopg[binary]>=3.1,<4.0"
      - name: Migracao persistente autorizada - exclusivamente homologacao
        env:
          ED02_HOMOLOG_DATABASE_URL: ${{ secrets.ED02_TEST_DATABASE_URL }}
          ED02_V52_MIGRATION_AUTHORIZED: 'true'
        run: python ed02_5_v52_migration.py

  ed025_v53_readonly:
    name: ED02.5 V5.3 - Validacao Flask e PostgreSQL somente leitura
    if: >-
      github.event_name == 'push' &&
