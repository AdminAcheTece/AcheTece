        env:
          ED02_V56_READONLY_AUTHORIZED: 'true'
          ED02_HOMOLOG_DATABASE_URL: ${{ secrets.ED02_TEST_DATABASE_URL }}
        run: python test_ed02_5_v56_auditoria_pg.py
