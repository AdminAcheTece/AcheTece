        run: python test_ed02_5_v54_flask_pg_integrado.py

  ed025_v551_commit_concorrente:
    name: ED02.5 V5.5.1 - Concorrencia PostgreSQL commits e auditoria
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ed02-assinaturas-vigencia-ledger' &&
