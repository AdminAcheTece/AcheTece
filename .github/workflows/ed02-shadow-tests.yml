
name: ED02 - Testes do historico observacional

on:
  push:
    branches:
      - ed02-assinaturas-vigencia-ledger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes automatizados ED02
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de teste
        run: |
          python -m pip install "Flask>=3.0,<4.0" "SQLAlchemy>=2.0,<3.0"

      - name: Executar testes isolados
        run: |
          python -m unittest -v test_ed02_shadow_mock
          python -m unittest -v test_ed02_3d_fluxo_mock
          python -m unittest -v test_ed02_3e_mock
          python -m unittest -v test_ed02_3g_rotas_mock
          python -m unittest -v test_ed02_3g2_webhook_seguro
          python -m unittest -v test_ed02_3g3_assinatura_mock
          python -m unittest -v test_ed02_3g4_assinatura_webhook_mock
          python -m unittest -v test_ed02_3g5_banco_real_mock
          python -m unittest -v test_ed02_3g6_http_integrado
          python -m unittest -v test_ed02_3g7_financeiro_mock
          python -m unittest -v test_ed02_3g7c2_checkout_integrado
          python -m unittest -v test_ed02_3g7d_guard_mock

  homologacao_postgres_checkout:
    name: ED02.3G.7C.3 - Persistencia real PostgreSQL

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ed02-assinaturas-vigencia-ledger' &&
      github.actor == 'AdminAcheTece' &&
      github.event.head_commit.message == 'ED02_RUN_POSTGRES_HOMOLOG_V1'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: ed02-postgres-checkout-homolog
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install "SQLAlchemy>=2.0,<3.0" "psycopg2-binary>=2.9,<3.0" "psycopg[binary]>=3.1,<4.0"

      - name: Executar teste transacional com rollback
        env:
          ED02_HOMOLOG_DATABASE_URL: ${{ secrets.ED02_TEST_DATABASE_URL }}
        run: |
          python test_ed02_3g7c3_postgres_real.py
