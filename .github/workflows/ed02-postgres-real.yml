
name: ED02.3C - Teste PostgreSQL real

on:
  workflow_dispatch:
  push:
    branches:
      - ed02-assinaturas-vigencia-ledger
    paths:
      - '.github/workflows/ed02-postgres-real.yml'

permissions:
  contents: read

jobs:
  teste_postgres:
    if: github.ref == 'refs/heads/ed02-assinaturas-vigencia-ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ED02_TEST_DATABASE_URL: ${{ secrets.ED02_TEST_DATABASE_URL }}

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install "SQLAlchemy>=2.0,<3.0" "psycopg2-binary>=2.9,<3.0"

      - name: Executar teste PostgreSQL
        run: python -m unittest -v test_ed02_postgres_real
