name: ED02 V5.7.5 - Rotas originais PostgreSQL protegido
on:
  push:
    branches: [ed02-assinaturas-vigencia-ledger]
permissions:
  contents: read
jobs:
  homologacao_v575:
    name: ED02.5 V5.7.5 - Rotas originais HTTP PostgreSQL READ ONLY
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ed02-assinaturas-vigencia-ledger' &&
      github.actor == 'AdminAcheTece' &&
      github.event.head_commit.message == 'ED02_RUN_ORIGINAL_HTTP_PG_ED025_V575'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ed02-postgres-checkout-homolog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias reais da aplicacao
        run: python -m pip install -r requirements.txt
      - name: Executar rotas publicas originais contra PostgreSQL real sem escrita
        env:
          ED02_HOMOLOG_DATABASE_URL: ${{ secrets.ED02_TEST_DATABASE_URL }}
          ED02_V575_READONLY_AUTHORIZED: 'true'
          ED02_V575_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python test_ed02_5_v575_rotas_originais_pg.py
